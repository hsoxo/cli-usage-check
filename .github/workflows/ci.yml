name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (debug + release)
    # macos-15 ships Xcode 16, which exposes the SwiftUI `\.openSettings`
    # environment value used by MenuBarContent. Xcode 15 on macos-14 fails
    # with "generic parameter 'T' could not be inferred".
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: swift build (debug)
        run: swift build

      - name: Package .app (release)
        run: bash scripts/build-app.sh

      - name: Confirm bundle exists
        run: |
          test -d "build/AI Usage Check.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "build/AI Usage Check.app/Contents/Info.plist"
